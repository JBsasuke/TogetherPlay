name: Android debug build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: false
      - name: Build Tailscale bridge (gomobile)
        working-directory: tailscale
        run: |
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          go get tailscale.com@latest
          go mod tidy
          go get golang.org/x/mobile/bind@latest
          go install golang.org/x/mobile/cmd/gomobile@latest golang.org/x/mobile/cmd/gobind@latest
          export PATH="$PATH:$(go env GOPATH)/bin"
          gomobile init
          mkdir -p ../app/libs
          gomobile bind -target=android/arm,android/arm64 -androidapi 23 -ldflags="-s -w" -o ../app/libs/tsbridge.aar .
          ls -la ../app/libs
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/togetherplay.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/togetherplay.jks" >> "$GITHUB_ENV"
            echo "Firma fija activada"
          else
            # Sin secretos: llave temporal (igual que antes, cambia en cada compilación).
            keytool -genkeypair -keystore "$RUNNER_TEMP/temp.jks" -storetype PKCS12 -alias togetherplay \
              -keyalg RSA -keysize 2048 -validity 30 -storepass temporal123 -keypass temporal123 -dname "CN=temporal"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/temp.jks" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASSWORD_FALLBACK=temporal123" >> "$GITHUB_ENV"
            echo "Sin secreto KEYSTORE_BASE64: llave temporal (habrá que desinstalar al actualizar)"
          fi
      - name: Assemble debug APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: gradle --no-daemon :app:assembleDebug :app:assembleRelease
      - name: Show signing certificate
        run: |
          SIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | tail -1)
          "$SIGNER" verify --print-certs app/build/outputs/apk/debug/*.apk | grep -E "DN|SHA-256"
      - uses: actions/upload-artifact@v4
        with:
          name: TogetherPlay-debug-apk
          path: app/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: tsbridge-aar
          path: app/libs/tsbridge.aar
      - name: Publish release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          TAG="v${VERSION}-${GITHUB_RUN_NUMBER}"
          APK=$(ls app/build/outputs/apk/release/*.apk 2>/dev/null | head -1)
          [ -z "$APK" ] && APK=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          cp "$APK" "TogetherPlay-${VERSION}.apk"
          gh release create "$TAG" "TogetherPlay-${VERSION}.apk" app/libs/tsbridge.aar \
            --title "TogetherPlay ${VERSION} (compilación ${GITHUB_RUN_NUMBER})" \
            --notes "APK firmado y ofuscado (release), sin servidor puesto: escribe el tuyo en la app. tsbridge.aar: Tailscale integrado para compilar en Android Studio (cópialo en app/libs)." \
            --latest
