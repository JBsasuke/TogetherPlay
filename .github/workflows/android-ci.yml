name: Android debug build

on:
  push:
    branches: [ feature/stream-relay ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: false
      - name: Build Tailscale bridge (gomobile)
        working-directory: tailscale
        run: |
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          go get tailscale.com@latest
          go mod tidy
          go get golang.org/x/mobile/bind@latest
          go install golang.org/x/mobile/cmd/gomobile@latest golang.org/x/mobile/cmd/gobind@latest
          export PATH="$PATH:$(go env GOPATH)/bin"
          gomobile init
          mkdir -p ../app/libs
          gomobile bind -target=android/arm,android/arm64 -androidapi 23 -ldflags="-s -w" -o ../app/libs/tsbridge.aar .
          ls -la ../app/libs
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/togetherplay.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/togetherplay.jks" >> "$GITHUB_ENV"
            echo "Firma fija activada"
          else
            echo "Sin secreto KEYSTORE_BASE64: se usa la firma de depuración temporal"
          fi
      - name: Assemble debug APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: TogetherPlay-debug-apk
          path: app/build/outputs/apk/debug/*.apk
