org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8 -XX:+UseParallelGC
android.useAndroidX=true
kotlin.code.style=official
# Compilación más rápida en Android Studio: tareas en paralelo y caché de resultados.
org.gradle.parallel=true
org.gradle.caching=true

# Solo ARM (Shield, Onn y teléfonos): APK mucho más liviano para que quepa en la Shield.
togetherplayArmOnly=true
